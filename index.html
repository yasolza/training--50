<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training +50</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <img src="logo.png" alt="logo training +50" class="logo">
    
        <p>Sua vida com mais movimento!</p>
    </header>

    <main>
        <section> 
            <h2> Entrar</h2>
            <form id="formLogin"> 
                <label for="telefone">Telefone:</label>
                <input
                type="tel"
                id="telefone"
                name="telefone"
                placeholder="Digite seu número de telefone:"
                >

                <label for="senha">Senha:</label>
                <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Digite sua senha:"
                >

                <button type="submit">ENTRAR</button>
                

            </form>

            <P>Não possui cadastro?
                <a href="cadastro.html">Fazer cadastro</a>
            </P>
            
        </section>
    </main>
    
    <script src="script.js"></script>
    
</body>

</html>
